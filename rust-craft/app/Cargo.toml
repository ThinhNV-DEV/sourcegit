[package]
name = "sourcegit-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = "0.31"
png = "0.17"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
